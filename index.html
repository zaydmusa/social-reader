<style>
:root{
  --ground:#F2F3F6;
  --surface:#FFFFFF;
  --surface-sunk:#EAECF1;
  --ink:#171A21;
  --ink-soft:#5C6274;
  --ink-faint:#8B91A2;
  --line:#DDE0E9;
  --line-strong:#C4C9D6;
  --accent:#2F4BA8;
  --accent-ink:#FFFFFF;
  --r1:#2F4BA8; --r2:#A8432A; --r3:#3F6B4A; --r4:#7A3E86; --r5:#1F6F7A; --r6:#8A5A16;
  --shadow:0 1px 2px rgba(23,26,33,.05), 0 8px 24px -16px rgba(23,26,33,.28);
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101218;
    --surface:#181B23;
    --surface-sunk:#0C0E13;
    --ink:#E7E9F0;
    --ink-soft:#9AA1B4;
    --ink-faint:#6C7386;
    --line:#282C37;
    --line-strong:#3A3F4E;
    --accent:#8AA0EE;
    --accent-ink:#101218;
    --r1:#8AA0EE; --r2:#E08B6E; --r3:#7FBE92; --r4:#C696D4; --r5:#6FC2CE; --r6:#D6AC5E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#101218;
  --surface:#181B23;
  --surface-sunk:#0C0E13;
  --ink:#E7E9F0;
  --ink-soft:#9AA1B4;
  --ink-faint:#6C7386;
  --line:#282C37;
  --line-strong:#3A3F4E;
  --accent:#8AA0EE;
  --accent-ink:#101218;
  --r1:#8AA0EE; --r2:#E08B6E; --r3:#7FBE92; --r4:#C696D4; --r5:#6FC2CE; --r6:#D6AC5E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 96px;}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:14px;margin-bottom:26px;border-bottom:1px solid var(--line);
}
.brand{
  font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.01em;
  margin:0;color:var(--ink);
}
.brand em{font-style:normal;color:var(--accent);}
.whoami{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}

/* ---------- type ---------- */
h2{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.01em;}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 10px;
}
.lede{color:var(--ink-soft);margin:0;max-width:60ch;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* ---------- panels ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:22px;box-shadow:var(--shadow);
}
.stack{display:flex;flex-direction:column;gap:18px;}
.stack-tight{display:flex;flex-direction:column;gap:10px;}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;}
.field > label{font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.row > .field{flex:1 1 160px;min-width:0;}
input,textarea{
  font-family:var(--sans);font-size:15px;color:var(--ink);
  background:var(--ground);border:1px solid var(--line-strong);border-radius:4px;
  padding:9px 11px;width:100%;
}
input.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
textarea{resize:vertical;min-height:76px;line-height:1.5;}
input::placeholder,textarea::placeholder{color:var(--ink-faint);}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

button{
  font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;
  border-radius:4px;padding:9px 15px;border:1px solid transparent;
  background:var(--accent);color:var(--accent-ink);
  transition:opacity .12s ease;
}
button:hover:not(:disabled){opacity:.88;}
button:disabled{opacity:.45;cursor:not-allowed;}
button.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line-strong);}
button.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--ink-faint);opacity:1;}
button.link{
  background:none;border:none;color:var(--accent);padding:0;font-size:13px;
  text-decoration:underline;text-underline-offset:2px;
}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* ---------- book head ---------- */
.book-title{font-family:var(--display);font-size:31px;font-weight:600;line-height:1.15;margin:0 0 4px;letter-spacing:-.015em;text-wrap:balance;}
.book-author{color:var(--ink-soft);margin:0;font-size:15px;}
.book-author .len{color:var(--ink-faint);}

/* ---------- the page rail ---------- */
.rail{margin:26px 0 4px;}
.rail-track{
  position:relative;height:34px;
  background:var(--surface-sunk);border:1px solid var(--line);border-radius:3px;
}
.rail-fill{position:absolute;top:0;bottom:0;left:0;background:color-mix(in srgb,var(--accent) 13%,transparent);border-right:1px solid var(--accent);}
.rail-tick{position:absolute;bottom:0;width:1px;height:9px;background:var(--line-strong);transform:translateX(-.5px);}
.rail-dot{
  position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);border:2px solid var(--surface);
}
.rail-scale{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  margin-top:5px;font-variant-numeric:tabular-nums;
}

/* ---------- roster ---------- */
.roster{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;}
.roster li{
  display:flex;align-items:baseline;gap:10px;
  padding:9px 0;border-top:1px solid var(--line);
}
.swatch{width:8px;height:8px;border-radius:50%;flex:none;align-self:center;}
.roster .nm{font-weight:500;}
.roster .you{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
.roster .pos{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.roster .pct{color:var(--ink-faint);}

/* ---------- threads ---------- */
.thread-list{display:flex;flex-direction:column;gap:0;}
.thread{
  display:grid;grid-template-columns:64px 1fr;gap:0 18px;
  padding:20px 0;border-top:1px solid var(--line);
}
.gutter{
  font-family:var(--mono);font-size:12px;color:var(--ink-faint);
  text-align:right;padding-top:2px;font-variant-numeric:tabular-nums;line-height:1.5;
}
.gutter .pg{display:block;font-size:15px;color:var(--ink);}
.gutter .pglabel{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
.msg{min-width:0;}
.msg + .msg{margin-top:14px;}
.byline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin-bottom:3px;}
.byline .nm{font-weight:500;color:var(--ink);}
.byline time{color:var(--ink-faint);font-family:var(--mono);font-size:11.5px;}
.body-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;}
.replies{
  margin-top:14px;padding-left:14px;
  border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px;
}
.reply-form{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.reply-form textarea{min-height:58px;font-size:14px;}

/* ---------- spoiler guard ---------- */
.veil{
  border:1px dashed var(--line-strong);border-radius:5px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;color:var(--ink-soft);font-size:13.5px;
}

/* ---------- misc ---------- */
.code-badge{
  font-family:var(--mono);font-size:19px;letter-spacing:.14em;font-weight:500;
  color:var(--ink);background:var(--surface-sunk);border:1px solid var(--line);
  border-radius:4px;padding:7px 13px;display:inline-block;
}
.share{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.share p{margin:0;font-size:13px;color:var(--ink-soft);max-width:38ch;}
.empty{color:var(--ink-soft);padding:22px 0;border-top:1px solid var(--line);}
.note{font-size:12.5px;color:var(--ink-faint);margin:0;}
.alert{
  background:color-mix(in srgb,var(--r2) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--r2) 35%,var(--line));
  color:var(--ink);border-radius:5px;padding:13px 15px;font-size:13.5px;
}
.divider{height:1px;background:var(--line);border:0;margin:0;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.shelf{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.shelf li{border-top:1px solid var(--line);}
.shelf button{
  width:100%;background:none;border:none;text-align:left;padding:13px 2px;
  display:flex;align-items:baseline;gap:10px;color:var(--ink);border-radius:0;
}
.shelf button:hover{opacity:1;background:var(--surface-sunk);}
.shelf .t{font-family:var(--display);font-size:16px;font-weight:600;}
.shelf .a{color:var(--ink-soft);font-size:13px;}
.shelf .c{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-faint);letter-spacing:.1em;}
@media (max-width:520px){
  .thread{grid-template-columns:1fr;gap:8px;}
  .gutter{text-align:left;display:flex;align-items:baseline;gap:6px;}
  .gutter .pg{font-size:13px;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}
</style>

<div class="wrap">
  <div class="masthead">
    <h1 class="brand">Margin<em>alia</em></h1>
    <div class="whoami" id="whoami"></div>
  </div>
  <div id="view"></div>
</div>

<script>
"use strict";

/* ---------------- local identity ---------------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("marg:"+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("marg:"+k, JSON.stringify(v)); }catch(e){} }
};

let me = {
  id: LS.get("readerId", null),
  name: LS.get("name", "")
};
if(!me.id){
  me.id = "r" + Math.random().toString(36).slice(2,10);
  LS.set("readerId", me.id);
}

const READER_COLORS = ["var(--r1)","var(--r2)","var(--r3)","var(--r4)","var(--r5)","var(--r6)"];
function colorFor(id){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return READER_COLORS[h % READER_COLORS.length];
}

/* ---------------- utilities ---------------- */
const view = document.getElementById("view");
const whoami = document.getElementById("whoami");

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function when(ts){
  if(!ts) return "";
  const d = new Date(ts), diff = (Date.now() - ts) / 1000;
  if(diff < 60) return "just now";
  if(diff < 3600) return Math.floor(diff/60) + "m ago";
  if(diff < 86400) return Math.floor(diff/3600) + "h ago";
  if(diff < 604800) return Math.floor(diff/86400) + "d ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
const CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no I/O/0/1
function newCode(){
  let s = "";
  for(let i=0;i<6;i++) s += CODE_ALPHABET[Math.floor(Math.random()*CODE_ALPHABET.length)];
  return s;
}
function pct(page, total){
  if(!total) return 0;
  return Math.max(0, Math.min(100, (page/total)*100));
}

/* ---------------- store ---------------- */
let db = null;
let dbState = "connecting"; // connecting | ready | absent
let subs = [];

function unsubAll(){ subs.forEach(u => { try{ u(); }catch(e){} }); subs = []; }

function dbFail(e){
  const code = e && e.code ? e.code : "unavailable";
  if(code === "revoked" || code === "not_granted" || code === "capability_disabled"){
    dbState = "absent"; db = null; render();
  }
  return code;
}

/* ---------------- app state ---------------- */
let route = { name:"home", code:null };
let session = null;          // { title, author, totalPages, createdAt }
let readers = [];            // [{id,name,page,updatedAt}]
let threads = [];            // [{id,page,authorId,authorName,text,createdAt}]
let replies = [];            // [{id,threadId,authorId,authorName,text,createdAt}]
let loading = false;
let notFound = false;
let banner = null;
let hideAhead = LS.get("hideAhead", true);
let revealed = new Set();
let openReply = null;
let pendingPage = null;      // draft value of the "your page" input

function parseHash(){
  const m = (location.hash || "").match(/^#\/s\/([A-Za-z0-9]{1,12})$/);
  return m ? { name:"session", code:m[1].toUpperCase() } : { name:"home", code:null };
}

function goto(hash){
  if(location.hash === hash) onRoute();
  else location.hash = hash;
}

async function onRoute(){
  const next = parseHash();
  unsubAll();
  route = next; session = null; readers = []; threads = []; replies = [];
  notFound = false; revealed = new Set(); openReply = null; pendingPage = null;
  if(route.name === "session"){
    loading = true; render();
    await watchSession(route.code);
  } else {
    loading = false; render();
  }
}
window.addEventListener("hashchange", onRoute);

async function watchSession(code){
  if(!db){ loading = false; render(); return; }
  const base = "sessions/" + code;
  try{
    const snap = await db.doc(base).get();
    if(!snap.exists){ loading = false; notFound = true; render(); return; }
  }catch(e){ dbFail(e); loading = false; render(); return; }

  subs.push(db.doc(base).onSnapshot(s => {
    session = s.exists ? s.data() : null;
    loading = false; render();
  }, dbFail));

  subs.push(db.collection(base + "/readers").onSnapshot(q => {
    readers = q.docs.map(d => Object.assign({ id:d.id }, d.data()));
    render();
  }, dbFail));

  subs.push(db.collection(base + "/threads").orderBy("page").limit(500).onSnapshot(q => {
    threads = q.docs.map(d => Object.assign({ id:d.id }, d.data()));
    render();
  }, dbFail));

  subs.push(db.collection(base + "/replies").orderBy("createdAt").limit(1000).onSnapshot(q => {
    replies = q.docs.map(d => Object.assign({ id:d.id }, d.data()));
    render();
  }, dbFail));

  // announce myself onto the roster
  if(me.name){
    try{
      const rref = db.doc(base + "/readers/" + me.id);
      const existing = await rref.get();
      if(!existing.exists) await rref.set({ name: me.name, page: 0, updatedAt: Date.now() });
      else if(existing.data().name !== me.name) await rref.update({ name: me.name });
    }catch(e){ dbFail(e); }
  }
}

/* ---------------- actions ---------------- */
function rememberSession(code, title){
  const shelf = LS.get("shelf", []).filter(s => s.code !== code);
  shelf.unshift({ code, title, at: Date.now() });
  LS.set("shelf", shelf.slice(0,20));
}

async function createSession(title, author, totalPages){
  if(!db) return;
  banner = null;
  let code = null;
  for(let attempt=0; attempt<5; attempt++){
    const candidate = newCode();
    try{
      const s = await db.doc("sessions/" + candidate).get();
      if(!s.exists){ code = candidate; break; }
    }catch(e){ dbFail(e); banner = "Couldn't reach the shared store. Try again in a moment."; render(); return; }
  }
  if(!code){ banner = "Couldn't pick a free reading code. Try again."; render(); return; }
  try{
    await db.doc("sessions/" + code).set({
      title, author, totalPages, createdBy: me.name, createdAt: Date.now()
    });
    await db.doc("sessions/" + code + "/readers/" + me.id).set({ name: me.name, page: 0, updatedAt: Date.now() });
  }catch(e){
    dbFail(e);
    banner = "Couldn't create the reading. Try again in a moment.";
    render(); return;
  }
  rememberSession(code, title);
  goto("#/s/" + code);
}

async function setMyPage(page){
  if(!db || !session) return;
  const p = Math.max(0, Math.min(session.totalPages, Math.round(page)));
  try{
    await db.doc("sessions/" + route.code + "/readers/" + me.id)
      .set({ name: me.name, page: p, updatedAt: Date.now() });
    pendingPage = null;
  }catch(e){
    dbFail(e);
    banner = "Couldn't save your page. Check your connection and try again.";
  }
  render();
}

async function postThread(page, text){
  if(!db || !session) return;
  try{
    await db.collection("sessions/" + route.code + "/threads").add({
      page: Math.max(1, Math.min(session.totalPages, Math.round(page))),
      authorId: me.id, authorName: me.name, text, createdAt: Date.now()
    });
  }catch(e){
    dbFail(e);
    banner = "Couldn't post that note. Check your connection and try again.";
    render();
  }
}

async function postReply(threadId, text){
  if(!db) return;
  try{
    await db.collection("sessions/" + route.code + "/replies").add({
      threadId, authorId: me.id, authorName: me.name, text, createdAt: Date.now()
    });
    openReply = null;
  }catch(e){
    dbFail(e);
    banner = "Couldn't post that reply. Check your connection and try again.";
  }
  render();
}

async function saveName(name){
  me.name = name.trim();
  LS.set("name", me.name);
  if(db && route.name === "session" && session){
    try{
      await db.doc("sessions/" + route.code + "/readers/" + me.id)
        .set({ name: me.name, page: myPage(), updatedAt: Date.now() });
    }catch(e){ dbFail(e); }
  }
  render();
}

function myPage(){
  const r = readers.find(r => r.id === me.id);
  return r ? (r.page || 0) : 0;
}

/* ---------------- rendering ---------------- */
function render(){
  whoami.innerHTML = me.name
    ? '<span>Reading as <strong>' + esc(me.name) + '</strong></span>' +
      '<button class="link" data-act="rename">change</button>'
    : "";

  if(dbState === "connecting" && !db){
    view.innerHTML = '<p class="lede">Connecting to your shared readings…</p>';
    return;
  }
  if(dbState === "absent"){
    view.innerHTML =
      '<div class="panel stack">' +
        '<div><p class="eyebrow">Not connected</p>' +
        '<h2>This copy can’t reach the shared store</h2></div>' +
        '<p class="lede">Marginalia keeps everyone’s progress and notes in a shared database that only exists on the published Artifact. Open the published link on claude.ai and it will sync.</p>' +
      '</div>';
    return;
  }
  if(!me.name){ renderNameGate(); return; }
  if(route.name === "session") renderSession();
  else renderHome();
}

function renderNameGate(){
  view.innerHTML =
    '<div class="panel stack">' +
      '<div><p class="eyebrow">First, who’s reading</p>' +
      '<h2>What should your friends see in the margin?</h2></div>' +
      '<p class="lede">Your name is stamped on every note and reply you leave, and marks where you are in the book.</p>' +
      '<form data-form="name" class="stack-tight">' +
        '<div class="field"><label for="nm">Your name</label>' +
        '<input id="nm" name="name" maxlength="40" autocomplete="name" placeholder="Zayd" required></div>' +
        '<div class="actions"><button type="submit">Start reading</button></div>' +
      '</form>' +
    '</div>';
  const el = view.querySelector("#nm"); if(el) el.focus();
}

function renderHome(){
  const shelf = LS.get("shelf", []);
  view.innerHTML =
    (banner ? '<div class="alert" style="margin-bottom:18px">' + esc(banner) + '</div>' : '') +
    '<div class="stack">' +
      '<div class="panel stack">' +
        '<div><p class="eyebrow">Start a reading</p>' +
        '<h2>Open a book to read alongside someone</h2></div>' +
        '<form data-form="create" class="stack-tight">' +
          '<div class="field"><label for="bt">Title</label>' +
          '<input id="bt" name="title" maxlength="140" placeholder="The Brothers Karamazov" required></div>' +
          '<div class="row">' +
            '<div class="field"><label for="ba">Author</label>' +
            '<input id="ba" name="author" maxlength="100" placeholder="Fyodor Dostoevsky" required></div>' +
            '<div class="field" style="flex:0 1 150px"><label for="bp">Pages</label>' +
            '<input id="bp" name="pages" class="num" type="number" min="1" max="20000" placeholder="796" required></div>' +
          '</div>' +
          '<div class="actions"><button type="submit">Create reading</button>' +
          '<span class="note">You’ll get a code to send your friend.</span></div>' +
        '</form>' +
      '</div>' +

      '<div class="panel stack">' +
        '<div><p class="eyebrow">Join a reading</p>' +
        '<h2>Someone sent you a code</h2></div>' +
        '<form data-form="join" class="row" style="align-items:flex-end">' +
          '<div class="field" style="flex:0 1 200px"><label for="jc">Reading code</label>' +
          '<input id="jc" name="code" class="num" maxlength="6" style="text-transform:uppercase;letter-spacing:.14em" placeholder="K7MQP4" required></div>' +
          '<button type="submit" class="ghost">Open</button>' +
        '</form>' +
      '</div>' +

      (shelf.length ?
        '<div class="panel">' +
          '<p class="eyebrow">On your shelf</p>' +
          '<ul class="shelf">' +
            shelf.map(s =>
              '<li><button data-act="open" data-code="' + esc(s.code) + '">' +
                '<span class="t">' + esc(s.title) + '</span>' +
                '<span class="c">' + esc(s.code) + '</span>' +
              '</button></li>'
            ).join("") +
          '</ul>' +
        '</div>' : '') +
    '</div>';
}

function renderSession(){
  if(loading){ view.innerHTML = '<p class="lede">Opening the book…</p>'; return; }
  if(notFound){
    view.innerHTML =
      '<div class="panel stack">' +
        '<div><p class="eyebrow">Code ' + esc(route.code) + '</p><h2>No reading with that code</h2></div>' +
        '<p class="lede">Codes are six characters and case-insensitive. Check it with whoever sent it.</p>' +
        '<div class="actions"><button data-act="home">Back to your shelf</button></div>' +
      '</div>';
    return;
  }
  if(!session){ view.innerHTML = '<p class="lede">Opening the book…</p>'; return; }

  rememberSession(route.code, session.title);

  const total = session.totalPages;
  const mine = myPage();
  const sorted = readers.slice().sort((a,b) => (b.page||0) - (a.page||0));
  const draft = pendingPage === null ? mine : pendingPage;

  /* --- rail --- */
  const ticks = threads.map(t =>
    '<span class="rail-tick" style="left:' + pct(t.page,total).toFixed(2) + '%"></span>').join("");
  const dots = readers.map(r =>
    '<span class="rail-dot" style="left:' + pct(r.page||0,total).toFixed(2) + '%;background:' + colorFor(r.id) + '" title="' + esc(r.name) + '"></span>').join("");

  const rail =
    '<div class="rail">' +
      '<div class="rail-track">' +
        '<span class="rail-fill" style="width:' + pct(mine,total).toFixed(2) + '%"></span>' +
        ticks + dots +
      '</div>' +
      '<div class="rail-scale"><span>p. 1</span><span>p. ' + total + '</span></div>' +
    '</div>';

  /* --- roster --- */
  const roster =
    '<ul class="roster">' +
      sorted.map(r =>
        '<li>' +
          '<span class="swatch" style="background:' + colorFor(r.id) + '"></span>' +
          '<span class="nm">' + esc(r.name) + '</span>' +
          (r.id === me.id ? '<span class="you">you</span>' : '') +
          '<span class="pos">p. ' + (r.page||0) + ' <span class="pct">· ' + Math.round(pct(r.page||0,total)) + '%</span></span>' +
        '</li>').join("") +
    '</ul>';

  /* --- progress control --- */
  const progress =
    '<form data-form="page" class="row" style="align-items:flex-end;margin-top:18px">' +
      '<div class="field" style="flex:0 1 140px">' +
        '<label for="pg">You’re on page</label>' +
        '<input id="pg" name="page" class="num" type="number" min="0" max="' + total + '" value="' + draft + '"></div>' +
      '<button type="submit"' + (Number(draft) === mine ? ' disabled' : '') + '>Save progress</button>' +
    '</form>';

  /* --- threads --- */
  const byThread = {};
  replies.forEach(r => { (byThread[r.threadId] = byThread[r.threadId] || []).push(r); });

  const threadHTML = threads.map(t => {
    const ahead = hideAhead && t.page > mine && t.authorId !== me.id && !revealed.has(t.id);
    const kids = byThread[t.id] || [];
    if(ahead){
      return '<div class="thread">' +
        '<div class="gutter"><span class="pglabel">page</span><span class="pg">' + t.page + '</span></div>' +
        '<div class="veil">' +
          '<span>' + esc(t.authorName) + ' left a note ' + (t.page - mine) + ' page' + (t.page-mine===1?'':'s') + ' ahead of you.</span>' +
          '<button class="ghost" data-act="reveal" data-id="' + t.id + '">Read anyway</button>' +
        '</div></div>';
    }
    const msgs = [t].concat(kids).map((m,i) =>
      '<div class="msg">' +
        '<div class="byline">' +
          '<span class="swatch" style="background:' + colorFor(m.authorId) + '"></span>' +
          '<span class="nm">' + esc(m.authorName) + '</span>' +
          '<time>' + when(m.createdAt) + '</time>' +
        '</div>' +
        '<p class="body-text">' + esc(m.text) + '</p>' +
      '</div>');

    const head = msgs[0];
    const tail = msgs.slice(1).join("");

    const replyUI = openReply === t.id
      ? '<form data-form="reply" data-id="' + t.id + '" class="reply-form">' +
          '<textarea name="text" placeholder="Reply to ' + esc(t.authorName) + '…" required></textarea>' +
          '<div class="actions"><button type="submit">Post reply</button>' +
          '<button type="button" class="ghost" data-act="cancel-reply">Cancel</button></div>' +
        '</form>'
      : '<div class="actions" style="margin-top:12px">' +
          '<button class="link" data-act="reply" data-id="' + t.id + '">' +
          (kids.length ? 'Reply' : 'Start a reply') + '</button></div>';

    return '<div class="thread">' +
      '<div class="gutter"><span class="pglabel">page</span><span class="pg">' + t.page + '</span></div>' +
      '<div class="msg-col">' + head +
        (tail ? '<div class="replies">' + tail + '</div>' : '') +
        replyUI +
      '</div></div>';
  }).join("");

  const aheadCount = threads.filter(t => t.page > mine && t.authorId !== me.id).length;

  view.innerHTML =
    (banner ? '<div class="alert" style="margin-bottom:18px">' + esc(banner) + '</div>' : '') +
    '<div class="stack">' +

      '<div>' +
        '<button class="link" data-act="home">← All readings</button>' +
        '<h2 class="book-title" style="margin-top:10px">' + esc(session.title) + '</h2>' +
        '<p class="book-author">' + esc(session.author) +
          ' <span class="len">· ' + total + ' pages</span></p>' +
        rail + roster + progress +
      '</div>' +

      '<div class="panel share">' +
        '<span class="code-badge">' + esc(route.code) + '</span>' +
        '<p>Send this code to whoever you’re reading with — they enter it on the home screen to join.</p>' +
      '</div>' +

      '<div class="panel stack">' +
        '<div><p class="eyebrow">Leave a note</p>' +
        '<h2>Say something about a page</h2></div>' +
        '<form data-form="thread" class="stack-tight">' +
          '<div class="row">' +
            '<div class="field" style="flex:0 1 130px"><label for="tp">On page</label>' +
            '<input id="tp" name="page" class="num" type="number" min="1" max="' + total + '" value="' + (mine || 1) + '" required></div>' +
          '</div>' +
          '<div class="field"><label for="tt">Note</label>' +
          '<textarea id="tt" name="text" placeholder="What happened here?" required></textarea></div>' +
          '<div class="actions"><button type="submit">Post note</button></div>' +
        '</form>' +
      '</div>' +

      '<div>' +
        '<div class="section-head" style="margin-bottom:6px">' +
          '<p class="eyebrow" style="margin:0">Margin · ' + threads.length + ' note' + (threads.length===1?'':'s') + '</p>' +
          '<button class="link" data-act="toggle-ahead">' +
            (hideAhead ? 'Show notes ahead of me' + (aheadCount ? ' (' + aheadCount + ')' : '') : 'Hide notes ahead of me') +
          '</button>' +
        '</div>' +
        (threads.length
          ? '<div class="thread-list">' + threadHTML + '</div>'
          : '<p class="empty">No notes yet. The first one usually shows up around page 30.</p>') +
      '</div>' +

    '</div>';
}

/* ---------------- events ---------------- */
document.addEventListener("submit", async (e) => {
  const form = e.target.closest("[data-form]");
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const fd = new FormData(form);
  banner = null;

  if(kind === "name"){
    const n = (fd.get("name")||"").toString().trim();
    if(n) await saveName(n);
  }
  else if(kind === "create"){
    const title = (fd.get("title")||"").toString().trim();
    const author = (fd.get("author")||"").toString().trim();
    const pages = parseInt(fd.get("pages"), 10);
    if(!title || !author || !(pages > 0)) return;
    const btn = form.querySelector("button[type=submit]");
    if(btn){ btn.disabled = true; btn.textContent = "Creating…"; }
    await createSession(title, author, pages);
  }
  else if(kind === "join"){
    const code = (fd.get("code")||"").toString().trim().toUpperCase();
    if(code) goto("#/s/" + code);
  }
  else if(kind === "page"){
    const p = parseInt(fd.get("page"), 10);
    if(!isNaN(p)) await setMyPage(p);
  }
  else if(kind === "thread"){
    const p = parseInt(fd.get("page"), 10);
    const text = (fd.get("text")||"").toString().trim();
    if(!text || isNaN(p)) return;
    form.reset();
    await postThread(p, text);
  }
  else if(kind === "reply"){
    const text = (fd.get("text")||"").toString().trim();
    if(!text) return;
    await postReply(form.dataset.id, text);
  }
});

document.addEventListener("input", (e) => {
  if(e.target && e.target.id === "pg"){
    pendingPage = e.target.value;
    const btn = e.target.closest("form").querySelector("button[type=submit]");
    if(btn) btn.disabled = Number(e.target.value) === myPage();
  }
});

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act === "home"){ goto("#/"); }
  else if(act === "open"){ goto("#/s/" + el.dataset.code); }
  else if(act === "rename"){
    const n = prompt("Your name", me.name);
    if(n && n.trim()) await saveName(n);
  }
  else if(act === "reveal"){ revealed.add(el.dataset.id); render(); }
  else if(act === "toggle-ahead"){ hideAhead = !hideAhead; LS.set("hideAhead", hideAhead); render(); }
  else if(act === "reply"){ openReply = el.dataset.id; render();
    const ta = view.querySelector('[data-form="reply"] textarea'); if(ta) ta.focus(); }
  else if(act === "cancel-reply"){ openReply = null; render(); }
});

/* ---------------- boot ---------------- */
render();
const capHost = (typeof window !== "undefined" && window.claude && typeof window.claude.use === "function")
  ? window.claude
  : { use: () => Promise.resolve(null) };
capHost.use("db").then(async (handle) => {
  db = handle;
  dbState = handle ? "ready" : "absent";
  await onRoute();
}).catch(() => {
  dbState = "absent";
  render();
});
</script>
